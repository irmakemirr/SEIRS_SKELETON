# IDE'den (container dışında) çalıştırma profili.
# Kimlik bilgileri ve portlar docker compose ile aynı .env dosyasından okunur (çalışma dizini = proje kökü).
# Mongo, compose ile yalnızca 127.0.0.1:${MONGO_PORT} üzerinden yayınlanır;
# "localhost" IPv6 (::1) çözülebildiği için adres açıkça 127.0.0.1 verilir.
spring:
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@127.0.0.1:${MONGO_PORT:27017}/radar?authSource=radar

server:
  port: ${APP_PORT:8080}
